<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#ffffff">
        <title>Offline - Buzzpay</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
                background: #f8fafc;
                color: #111827;
            }
            .card {
                max-width: 28rem;
                margin: 1rem;
                padding: 1.5rem;
                border: 1px solid #d1d5db;
                border-radius: 0.75rem;
                background: #ffffff;
            }
            h1 {
                margin: 0 0 0.5rem;
                font-size: 1.25rem;
            }
            p {
                margin: 0;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>You are offline</h1>
            <p>Buzzpay needs an internet connection to sync your latest data. Please reconnect and try again.</p>
        </main>
    </body>
</html>
